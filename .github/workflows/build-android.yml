name: Build Android Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

concurrency:
  group: build-android-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore preview signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: fundus-android-preview-signing-v1

      - name: Create preview signing key when missing
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Fundus Preview,O=Fundus,C=DE"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Android APK
        working-directory: app
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload preview
        uses: actions/upload-artifact@v7
        with:
          name: Fundus-Android-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
